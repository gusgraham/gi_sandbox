<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="600" viewBox="0 0 1024 600" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Sky gradient -->
        <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#0a1628"/>
            <stop offset="100%" style="stop-color:#1a2d4a"/>
        </linearGradient>
        
        <!-- Grass gradient -->
        <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#4a7c59"/>
            <stop offset="100%" style="stop-color:#3d6b4a"/>
        </linearGradient>
        
        <!-- Soil gradient (upper) -->
        <linearGradient id="soilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#6b5344"/>
            <stop offset="100%" style="stop-color:#5a4639"/>
        </linearGradient>
        
        <!-- Ground gradient (lower) -->
        <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#4a3d32"/>
            <stop offset="100%" style="stop-color:#3a2f26"/>
        </linearGradient>
        
        <!-- Deep ground -->
        <linearGradient id="deepGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#2d2520"/>
            <stop offset="100%" style="stop-color:#1a1512"/>
        </linearGradient>
        
        <!-- Arrow marker -->
        <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#4da6ff"/>
        </marker>
        <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#00d4aa"/>
        </marker>
        <marker id="arrowPink" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#ff7eb3"/>
        </marker>
        <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#ffaa00"/>
        </marker>
        
        <!-- Cloud filter for soft edges -->
        <filter id="cloudShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
        </filter>
        
        <!-- Rain drop -->
        <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#7ec8e3"/>
            <stop offset="100%" style="stop-color:#4da6ff"/>
        </linearGradient>
    </defs>
    
    <!-- SKY -->
    <rect x="0" y="0" width="1024" height="600" fill="url(#skyGrad)"/>
    
    <!-- GRASS SURFACE (sloped) -->
    <polygon points="0,140 700,180 700,200 0,160" fill="url(#grassGrad)"/>
    
    <!-- SOIL LAYER -->
    <polygon points="0,160 700,200 1024,200 1024,320 0,280" fill="url(#soilGrad)"/>
    
    <!-- GROUND LAYER -->
    <polygon points="0,280 1024,320 1024,480 0,440" fill="url(#groundGrad)"/>
    
    <!-- DEEP GROUND -->
    <polygon points="0,440 1024,480 1024,600 0,600" fill="url(#deepGrad)"/>
    
    <!-- LAYER BOUNDARIES (subtle lines) -->
    <line x1="0" y1="160" x2="700" y2="200" stroke="#7a6b5c" stroke-width="2" opacity="0.5"/>
    <line x1="700" y1="200" x2="1024" y2="200" stroke="#7a6b5c" stroke-width="2" opacity="0.5"/>
    <line x1="0" y1="280" x2="1024" y2="320" stroke="#5a4d42" stroke-width="2" opacity="0.4"/>
    <line x1="0" y1="440" x2="1024" y2="480" stroke="#3a3028" stroke-width="2" opacity="0.3"/>
    
    <!-- GULLY/DRAIN STRUCTURE -->
    <g id="drain">
        <!-- Gully grating -->
        <rect x="700" y="170" width="80" height="30" fill="#2a3a4a" stroke="#1a2a3a" stroke-width="2"/>
        <line x1="710" y1="175" x2="710" y2="195" stroke="#4a5a6a" stroke-width="2"/>
        <line x1="720" y1="175" x2="720" y2="195" stroke="#4a5a6a" stroke-width="2"/>
        <line x1="730" y1="175" x2="730" y2="195" stroke="#4a5a6a" stroke-width="2"/>
        <line x1="740" y1="175" x2="740" y2="195" stroke="#4a5a6a" stroke-width="2"/>
        <line x1="750" y1="175" x2="750" y2="195" stroke="#4a5a6a" stroke-width="2"/>
        <line x1="760" y1="175" x2="760" y2="195" stroke="#4a5a6a" stroke-width="2"/>
        <line x1="770" y1="175" x2="770" y2="195" stroke="#4a5a6a" stroke-width="2"/>
        
        <!-- Vertical pipe from gully -->
        <rect x="720" y="200" width="40" height="80" fill="#3a4a5a" stroke="#2a3a4a" stroke-width="2"/>
    </g>
    
    <!-- PIPE OUTLET -->
    <g id="pipe" transform="translate(800, 260)">
        <!-- Pipe body -->
        <ellipse cx="60" cy="40" rx="55" ry="40" fill="#4a5a6a" stroke="#3a4a5a" stroke-width="3"/>
        <ellipse cx="60" cy="40" rx="45" ry="32" fill="#2a3a4a"/>
        <!-- Water in pipe -->
        <ellipse cx="60" cy="50" rx="40" ry="20" fill="#3a7ca5" opacity="0.7"/>
        <!-- Pipe rim -->
        <ellipse cx="60" cy="40" rx="55" ry="40" fill="none" stroke="#5a6a7a" stroke-width="2"/>
        
        <!-- Connecting horizontal pipe -->
        <rect x="-60" y="15" width="70" height="50" fill="#4a5a6a" stroke="#3a4a5a" stroke-width="2"/>
    </g>
    
    <!-- RAIN CLOUD -->
    <g id="cloud" transform="translate(100, 30)" filter="url(#cloudShadow)">
        <ellipse cx="60" cy="50" rx="50" ry="35" fill="#b8c5d4"/>
        <ellipse cx="30" cy="55" rx="35" ry="28" fill="#c5d1de"/>
        <ellipse cx="100" cy="55" rx="40" ry="30" fill="#aab8c8"/>
        <ellipse cx="65" cy="35" rx="35" ry="25" fill="#d0dae6"/>
    </g>
    
    <!-- RAIN DROPS (animated via CSS in the container) -->
    <g id="raindrops" class="rain-animation">
        <ellipse cx="120" cy="100" rx="3" ry="6" fill="url(#dropGrad)"/>
        <ellipse cx="140" cy="110" rx="3" ry="6" fill="url(#dropGrad)"/>
        <ellipse cx="160" cy="95" rx="3" ry="6" fill="url(#dropGrad)"/>
        <ellipse cx="180" cy="105" rx="3" ry="6" fill="url(#dropGrad)"/>
        <ellipse cx="130" cy="120" rx="2" ry="5" fill="url(#dropGrad)"/>
        <ellipse cx="155" cy="125" rx="2" ry="5" fill="url(#dropGrad)"/>
        <ellipse cx="175" cy="115" rx="2" ry="5" fill="url(#dropGrad)"/>
    </g>
    
    <!-- FLOW ARROWS -->
    <g id="flow-arrows">
        <!-- Runoff arrow (surface to gully) -->
        <path d="M 300 165 Q 500 175, 695 180" 
              fill="none" stroke="#7c5cff" stroke-width="4" stroke-linecap="round"
              marker-end="url(#arrowBlue)" opacity="0.9"/>
        <text x="450" y="155" fill="#7c5cff" font-size="12" font-weight="600">RUNOFF</text>
        
        <!-- Soil infiltration arrow -->
        <path d="M 450 260 Q 600 255, 735 275" 
              fill="none" stroke="#00d4aa" stroke-width="3" stroke-linecap="round"
              marker-end="url(#arrowCyan)" opacity="0.9"/>
        <text x="560" y="245" fill="#00d4aa" font-size="11" font-weight="600">SOIL INF</text>
        
        <!-- Ground infiltration arrow -->
        <path d="M 450 400 Q 600 380, 800 320" 
              fill="none" stroke="#ff7eb3" stroke-width="3" stroke-linecap="round"
              marker-end="url(#arrowPink)" opacity="0.9"/>
        <text x="580" y="370" fill="#ff7eb3" font-size="11" font-weight="600">GROUND INF</text>
        
        <!-- Baseflow arrow (going right but below pipe, into deep ground) -->
        <path d="M 450 470 Q 700 500, 950 540" 
              fill="none" stroke="#ffaa00" stroke-width="3" stroke-linecap="round" stroke-dasharray="8,4"
              marker-end="url(#arrowOrange)" opacity="0.8"/>
        <text x="700" y="520" fill="#ffaa00" font-size="11" font-weight="600">BASEFLOW → lost to env</text>
        
        <!-- Percolation arrow (soil to ground) -->
        <path d="M 200 295 L 200 340" 
              fill="none" stroke="#00d4aa" stroke-width="2" stroke-dasharray="4,3"
              marker-end="url(#arrowCyan)" opacity="0.7"/>
        <text x="210" y="320" fill="#00d4aa" font-size="10">perc</text>
    </g>
    
    <!-- CHART PLACEHOLDERS (will be overlaid with actual charts) -->
    <!-- Qrain chart area (near cloud) -->
    <rect id="placeholder-qrain" x="250" y="20" width="160" height="90" 
          fill="rgba(15,22,40,0.85)" stroke="#4da6ff" stroke-width="2" rx="4"/>
    <text x="330" y="40" fill="#4da6ff" font-size="11" text-anchor="middle" font-weight="600">Qrain</text>
    
    <!-- Soil Store chart area -->
    <rect id="placeholder-soil" x="50" y="190" width="200" height="100" 
          fill="rgba(15,22,40,0.85)" stroke="#00d4aa" stroke-width="2" rx="4"/>
    <text x="150" y="210" fill="#00d4aa" font-size="11" text-anchor="middle" font-weight="600">SOIL STORE</text>
    
    <!-- Ground Store chart area -->
    <rect id="placeholder-ground" x="50" y="330" width="200" height="120" 
          fill="rgba(15,22,40,0.85)" stroke="#ff7eb3" stroke-width="2" rx="4"/>
    <text x="150" y="350" fill="#ff7eb3" font-size="11" text-anchor="middle" font-weight="600">GROUND STORE</text>
    
    <!-- Qnetwork chart area (near pipe) -->
    <rect id="placeholder-qnetwork" x="820" y="380" width="180" height="100" 
          fill="rgba(15,22,40,0.85)" stroke="#7dffaf" stroke-width="2" rx="4"/>
    <text x="910" y="400" fill="#7dffaf" font-size="11" text-anchor="middle" font-weight="600">Qnetwork</text>
    
    <!-- LABELS -->
    <text x="20" y="250" fill="#8a7b6c" font-size="12" font-weight="500" opacity="0.8">SOIL LAYER</text>
    <text x="20" y="380" fill="#6a5d52" font-size="12" font-weight="500" opacity="0.8">GROUND LAYER</text>
</svg>
